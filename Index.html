<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>식단 & 운동 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #0B0F19; color: #F1F5F9; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="p-3 md:p-6 max-w-4xl mx-auto min-h-screen">
  <!-- UI HTML은 기존 코드와 100% 동일하게 유지합니다. (길이 관계상 UI 부분은 질문 주신 원본 그대로 사용하셔도 됩니다.) -->
  <!-- ... (생략된 HTML 본문 영역: <header> 부터 <section> 달력 영역까지 기존 코드 복사/붙여넣기) ... -->

  <!-- 아래 Script 영역이 핵심 변경 사항입니다 -->
  <script>
    // 💡 [필수] Step 1에서 복사한 구글 앱스스크립트 웹 앱 URL을 입력하세요.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzNodJunA5V-qPmUElWtaNvKOTK8BX_Gh-zhsX56ZqR2KXLC6LwDjXtamiqPU8MpQ7vRQ/exec";

    let globalData = null;
    let currentDateStr = '';
    let bodyPeriodDays = 7;
    let calendarViewYear = 2026;
    let calendarViewMonth = 9;
    let bodyChartInstance = null;
    let calendarFilter = 'all';
    let currentMealFilter = 'all';

    // google.script.run 대신 fetch를 사용하도록 변경
    async function fetchData() {
      const icon = document.getElementById('refreshIcon');
      const iconM = document.getElementById('refreshIconMobile');
      if (icon) icon.classList.add('animate-spin');
      if (iconM) iconM.classList.add('animate-spin');

      try {
        const response = await fetch(GAS_URL);
        const result = await response.json();

        if (result.status === "success") {
          globalData = result.data;
          if (!currentDateStr) {
            currentDateStr = globalData.today;
          }
          const dParts = currentDateStr.split('-');
          calendarViewYear = parseInt(dParts[0], 10);
          calendarViewMonth = parseInt(dParts[1], 10) - 1;

          document.getElementById('selectedDateInput').value = currentDateStr;
          onDateSyncUpdate();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        alert('데이터 로드 실패: ' + err.message);
      } finally {
        if (icon) icon.classList.remove('animate-spin');
        if (iconM) iconM.classList.remove('animate-spin');
      }
    }

    function navigateDate(days) {
      const d = new Date(currentDateStr);
      d.setDate(d.getDate() + days);
      currentDateStr = d.toISOString().split('T')[0];
      document.getElementById('selectedDateInput').value = currentDateStr;
      onDateSyncUpdate();
    }

    function onDateInputChange(val) {
      if (val) {
        currentDateStr = val;
        onDateSyncUpdate();
      }
    }

    function goToToday() {
      if (globalData) {
        currentDateStr = globalData.today;
        document.getElementById('selectedDateInput').value = currentDateStr;
        onDateSyncUpdate();
      }
    }

    function onDateSyncUpdate() {
      renderDateView(currentDateStr);
      renderBodyChart();
      renderCalendar();
    }

    function getMealColor(mealType) {
      const t = String(mealType).trim();
      if (t.includes('아침')) return { bg: 'bg-sky-400', hover: 'hover:bg-sky-300', name: '아침', dot: 'bg-sky-400' };
      if (t.includes('점심')) return { bg: 'bg-indigo-500', hover: 'hover:bg-indigo-400', name: '점심', dot: 'bg-indigo-400' };
      if (t.includes('저녁')) return { bg: 'bg-purple-500', hover: 'hover:bg-purple-400', name: '저녁', dot: 'bg-purple-400' };
      return { bg: 'bg-emerald-400', hover: 'hover:bg-emerald-300', name: '간식', dot: 'bg-emerald-400' };
    }

    function setMealFilter(filterKey) {
      currentMealFilter = filterKey;
      ['all', '아침', '점심', '저녁', '간식'].forEach(k => {
        const btn = document.getElementById('mBtn_' + k);
        if (btn) {
          if (k === filterKey) {
            btn.className = 'px-2 py-0.5 rounded-lg bg-indigo-600 text-white font-bold transition flex items-center gap-1 shadow-sm';
          } else {
            btn.className = 'px-2 py-0.5 rounded-lg text-slate-400 hover:text-white transition flex items-center gap-1';
          }
        }
      });
      renderDateView(currentDateStr);
    }

    const tooltipEl = document.getElementById('floatingTooltip');
    function showFloatingTooltip(e, text) {
      tooltipEl.innerHTML = text;
      tooltipEl.classList.remove('hidden');
      updateTooltipPos(e);
    }
    
    // 연산자 줄바꿈 오류 수정
    function updateTooltipPos(e) {
      const x = e.clientX;
      const y = e.clientY - 42;
      tooltipEl.style.left = `${Math.max(10, Math.min(window.innerWidth - tooltipEl.offsetWidth - 10, x - tooltipEl.offsetWidth / 2))}px`;
      tooltipEl.style.top = `${Math.max(10, y)}px`;
    }
    function hideFloatingTooltip() {
      tooltipEl.classList.add('hidden');
    }

    function renderSegmentedBar(containerId, meals, nutrientKey, targetVal) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!meals || meals.length === 0) return;

      const totalVal = meals.reduce((sum, m) => sum + (Number(m[nutrientKey]) || 0), 0);
      const totalPct = Math.round((totalVal / targetVal) * 100);

      meals.forEach((m) => {
        const val = Number(m[nutrientKey]) || 0;
        if (val <= 0) return;
        const segWidthPct = (val / targetVal) * 100;
        const visualWidthPct = totalPct > 100 ? (val / totalVal) * 100 : segWidthPct;
        const color = getMealColor(m.type);
        const isDimmed = currentMealFilter !== 'all' && !m.type.includes(currentMealFilter);

        const seg = document.createElement('div');
        seg.className = `h-full ${color.bg} ${color.hover} transition-all duration-200 cursor-pointer border-r border-[#0B0F19]/40 last:border-r-0 ${isDimmed ? 'opacity-20' : 'opacity-100'}`;
        seg.style.width = `${visualWidthPct}%`;

        const tooltipText = `[${color.name}] ${val.toFixed(1)}g (${Math.round(segWidthPct)}%)${m.item ? ` · ${m.item}` : ''}`;
        seg.onmouseenter = (e) => showFloatingTooltip(e, tooltipText);
        seg.onmousemove = (e) => updateTooltipPos(e);
        seg.onmouseleave = hideFloatingTooltip;

        container.appendChild(seg);
      });
    }

    function renderDateView(dateStr) {
      if (!globalData) return;

      const mealObj = globalData.mealsByDate[dateStr] || { kcal: 0, carbs: 0, protein: 0, fat: 0, meals: [] };
      const workout = globalData.workoutsByDate[dateStr] || { type: '운동 없음', volume: 0, burn: 0, routine: '해당 날짜에 등록된 운동 기록이 없습니다.', weight: globalData.bodyMetrics.weight, bodyFat: globalData.bodyMetrics.bodyFat, bmr: globalData.bodyMetrics.bmr };

      const intakeKcal = Math.round(mealObj.kcal);
      const proteinG = Number(mealObj.protein).toFixed(1);
      const workoutBurn = Math.round(workout.burn);
      const bmrKcal = workout.bmr || globalData.bodyMetrics.bmr;
      const totalBurnKcal = bmrKcal + workoutBurn;
      
      // 연산자 줄바꿈 오류 수정
      const netKcal = intakeKcal - totalBurnKcal;

      document.getElementById('kpiIntake').innerHTML = intakeKcal.toLocaleString() + ' <span class="text-[10px] font-normal text-slate-400">kcal</span>';
      document.getElementById('kpiWorkoutBurn').innerHTML = workoutBurn.toLocaleString() + ' <span class="text-[10px] font-normal text-slate-400">kcal</span>';
      document.getElementById('kpiProtein').innerHTML = proteinG + ' <span class="text-[10px] font-normal text-slate-400">g</span>';
      document.getElementById('kpiTotalBurn').innerHTML = totalBurnKcal.toLocaleString() + ' <span class="text-[10px] font-normal text-slate-400">kcal</span>';
      
      const netColor = netKcal <= 0 ? 'text-emerald-400' : 'text-rose-400';
      const netSign = netKcal > 0 ? '+' : '';
      document.getElementById('kpiNet').className = 'text-base md:text-lg font-bold ' + netColor;
      document.getElementById('kpiNet').innerHTML = `${netSign}${netKcal.toLocaleString()} <span class="text-[10px] font-normal text-slate-400">kcal</span>`;

      document.getElementById('bodyWeight').innerHTML = (workout.weight || globalData.bodyMetrics.weight) + ' <span class="text-[10px] font-normal text-slate-400">kg</span>';
      document.getElementById('bodyFat').innerHTML = (workout.bodyFat || globalData.bodyMetrics.bodyFat) + ' <span class="text-[10px] font-normal text-slate-400">%</span>';
      document.getElementById('bodyBmr').innerHTML = bmrKcal.toLocaleString() + ' <span class="text-[10px] font-normal text-slate-400">kcal</span>';

      const meals = mealObj.meals || [];
      const detailBox = document.getElementById('mealDetailBox');
      let targetMeals = meals;
      let filterTitle = '오늘 하루 전체 식사 요약';

      if (currentMealFilter !== 'all') {
        targetMeals = meals.filter(m => m.type.includes(currentMealFilter));
        filterTitle = `[${currentMealFilter}] 식사 영양 상세`;
      }

      const fProtein = targetMeals.reduce((s, m) => s + (Number(m.protein) || 0), 0);
      const fCarbs = targetMeals.reduce((s, m) => s + (Number(m.carbs) || 0), 0);
      const fFat = targetMeals.reduce((s, m) => s + (Number(m.fat) || 0), 0);
      const fKcal = targetMeals.reduce((s, m) => s + (Number(m.kcal) || 0), 0);
      const itemsList = targetMeals.map(m => m.item).filter(Boolean).join(' · ');

      const pPctOfTarget = Math.round((fProtein / 130) * 100);
      const cPctOfTarget = Math.round((fCarbs / 240) * 100);
      const fPctOfTarget = Math.round((fFat / 55) * 100);

      detailBox.innerHTML = `
        <div class="flex items-center justify-between pb-1.5 mb-2 border-b border-slate-700/60">
          <span class="font-bold text-slate-200 text-xs flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full ${currentMealFilter === 'all' ? 'bg-indigo-400' : getMealColor(currentMealFilter).bg}"></span>
            ${filterTitle}
          </span>
          <span class="text-xs font-bold text-slate-300">${fKcal.toLocaleString()} kcal</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5 text-center mb-1.5">
          <div class="bg-[#111827] p-1.5 rounded-lg border border-slate-800">
            <div class="text-[9px] text-slate-400">단백질</div>
            <div class="text-[11px] font-bold text-indigo-300">${fProtein.toFixed(1)}g <span class="text-[9px] text-slate-400">(${pPctOfTarget}%)</span></div>
          </div>
          <div class="bg-[#111827] p-1.5 rounded-lg border border-slate-800">
            <div class="text-[9px] text-slate-400">탄수화물</div>
            <div class="text-[11px] font-bold text-amber-300">${Math.round(fCarbs)}g <span class="text-[9px] text-slate-400">(${cPctOfTarget}%)</span></div>
          </div>
          <div class="bg-[#111827] p-1.5 rounded-lg border border-slate-800">
            <div class="text-[9px] text-slate-400">지방</div>
            <div class="text-[11px] font-bold text-slate-300">${Math.round(fFat)}g <span class="text-[9px] text-slate-400">(${fPctOfTarget}%)</span></div>
          </div>
        </div>
        ${itemsList ? `<div class="text-[10px] text-slate-400 truncate mt-1">🍽️ 메뉴: <span class="text-slate-200">${itemsList}</span></div>` : '<div class="text-[10px] text-slate-500 mt-1">해당 끼니에 등록된 식사 기록이 없습니다.</div>'}
      `;

      renderSegmentedBar('proteinSegmentBar', meals, 'protein', 130);
      renderSegmentedBar('carbsSegmentBar', meals, 'carbs', 240);
      renderSegmentedBar('fatSegmentBar', meals, 'fat', 55);

      const pPct = Math.round((mealObj.protein / 130) * 100);
      if (pPct >= 100) {
        document.getElementById('proteinRate').innerHTML = `<span class="text-indigo-400 font-bold">🥩 ${pPct}% (${proteinG} / 130g)</span>`;
      } else {
        document.getElementById('proteinRate').innerHTML = `<span class="text-indigo-300 font-medium">${pPct}% (${proteinG} / 130g)</span>`;
      }

      const cPct = Math.round((mealObj.carbs / 240) * 100);
      if (cPct > 100) {
        document.getElementById('carbsRate').innerHTML = `<span class="text-rose-400 font-bold">⚠️ ${cPct}% (${Math.round(mealObj.carbs)} / 240g)</span>`;
      } else {
        document.getElementById('carbsRate').innerHTML = `<span class="text-amber-300 font-medium">${cPct}% (${Math.round(mealObj.carbs)} / 240g)</span>`;
      }

      const fPct = Math.round((mealObj.fat / 55) * 100);
      if (fPct > 100) {
        document.getElementById('fatRate').innerHTML = `<span class="text-rose-400 font-bold">⚠️ ${fPct}% (${Math.round(mealObj.fat)} / 55g)</span>`;
      } else {
        document.getElementById('fatRate').innerHTML = `<span class="text-slate-300 font-medium">${fPct}% (${Math.round(mealObj.fat)} / 55g)</span>`;
      }

      document.getElementById('workoutTypeBadge').innerText = workout.type;
      document.getElementById('workoutDetailText').innerText = workout.routine || (workout.type !== '운동 없음' ? '상세 루틴 메모 없음' : '해당 날짜에 등록된 운동 기록이 없습니다.');
    }

    function setBodyPeriod(days) {
      bodyPeriodDays = days;
      const btn7 = document.getElementById('btnBody7');
      const btn30 = document.getElementById('btnBody30');
      if (days === 7) {
        btn7.className = 'px-2 py-0.5 rounded bg-indigo-600 text-white font-bold transition';
        btn30.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-white transition';
      } else {
        btn30.className = 'px-2 py-0.5 rounded bg-indigo-600 text-white font-bold transition';
        btn7.className = 'px-2 py-0.5 rounded text-slate-400 hover:text-white transition';
      }
      renderBodyChart();
    }

    function toggleBodyChart() {
      const container = document.getElementById('bodyChartContainer');
      container.classList.toggle('hidden');
      if (!container.classList.contains('hidden')) {
        renderBodyChart();
      }
    }

    function renderBodyChart() {
      if (!globalData) return;
      const ctx = document.getElementById('bodyChart');
      if (!ctx) return;

      const labels = [];
      const weights = [];
      const fats = [];
      const base = new Date(currentDateStr);
      let runningWeight = globalData.bodyMetrics.weight;
      let runningFat = globalData.bodyMetrics.bodyFat;

      // 연산자 줄바꿈 오류 수정
      for (let i = bodyPeriodDays - 1; i >= 0; i--) {
        const d = new Date(base);
        d.setDate(d.getDate() - i);
        const dStr = d.toISOString().split('T')[0];
        const mmdd = `${d.getMonth() + 1}/${d.getDate()}`;

        labels.push(mmdd);

        const work = globalData.workoutsByDate[dStr];
        if (work && work.weight > 0) runningWeight = work.weight;
        if (work && work.bodyFat > 0) runningFat = work.bodyFat;

        weights.push(runningWeight);
        fats.push(runningFat);
      }

      if (bodyChartInstance) bodyChartInstance.destroy();

      bodyChartInstance = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '몸무게 (kg)',
              data: weights,
              borderColor: 'rgba(129, 140, 248, 1)',
              backgroundColor: 'rgba(129, 140, 248, 0.1)',
              borderWidth: 2.5,
              yAxisID: 'yWeight',
              tension: 0.2,
              pointRadius: bodyPeriodDays === 7 ? 4 : 2,
              pointBackgroundColor: 'rgba(129, 140, 248, 1)'
            },
            {
              label: '체지방률 (%)',
              data: fats,
              borderColor: 'rgba(244, 114, 182, 1)',
              backgroundColor: 'rgba(244, 114, 182, 0.1)',
              borderWidth: 2.5,
              yAxisID: 'yFat',
              tension: 0.2,
              pointRadius: bodyPeriodDays === 7 ? 4 : 2,
              pointBackgroundColor: 'rgba(244, 114, 182, 1)'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            yWeight: { type: 'linear', position: 'left', title: { display: true, text: 'kg', color: '#94A3B8', font: { size: 10 } }, grid: { color: '#1E293B' }, ticks: { color: '#94A3B8', font: { size: 10 } }, suggestedMin: 84, suggestedMax: 90 },
            yFat: { type: 'linear', position: 'right', title: { display: true, text: '%', color: '#94A3B8', font: { size: 10 } }, grid: { drawOnChartArea: false }, ticks: { color: '#94A3B8', font: { size: 10 } }, suggestedMin: 20, suggestedMax: 30 },
            x: { grid: { display: false }, ticks: { color: '#94A3B8', autoSkip: bodyPeriodDays > 14, font: { size: 10 } } }
          },
          plugins: { legend: { position: 'top', labels: { color: '#CBD5E1', boxWidth: 10, font: { size: 10 } } } }
        }
      });
    }

    // 나머지 캘린더 관련 렌더링 함수들 (이하 기존 코드와 로직 동일하여 원본을 유지하시면 됩니다.)
    // ... 생략 ...

    window.onload = fetchData;
  </script>
</body>
</html>
